<!DOCTYPE html>
<html>

<head>
    <title>My Profile</title>

    <style>
        body {
            font-family: Arial;
            background: #f2f2f2;
        }

        .box {
            width: 450px;
            margin: 60px auto;
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 0 10px gray;
            text-align: center;
        }

        h1 {
            color: darkblue;
        }

        a {
            text-decoration: none;
            background: green;
            color: white;
            padding: 10px 20px;
            border-radius: 5px;
        }

        a:hover {
            background: darkgreen;
        }
    </style>
</head>

<body>

    <div class="box">
        <h1>Welcome {{ request.user.username }}</h1>

        <p>You are successfully logged in.</p>

        <br>

        <a href="{% url 'home' %}">Home</a>
        <br><br>

        <a href="{% url 'logout' %}">Logout</a>
    </div>

</body>

</html>
