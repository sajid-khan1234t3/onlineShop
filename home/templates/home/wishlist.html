<!DOCTYPE html>
<html>

<head>
    <title>My Wishlist</title>

    <style>
        body {
            font-family: Arial;
            background: #f2f2f2;
        }

        .box {
            width: 800px;
            margin: 30px auto;
            background: white;
            padding: 20px;
            border-radius: 10px;
        }

        .item {
            border-bottom: 1px solid #ccc;
            padding: 15px;
            margin-bottom: 10px;
        }

        img {
            width: 120px;
            height: 120px;
            object-fit: cover;
            border-radius: 8px;
        }

        h1 {
            text-align: center;
            color: darkred;
        }

        .remove-btn {
            background: red;
            color: white;
            padding: 10px 15px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        .remove-btn:hover {
            background: darkred;
        }
    </style>
</head>

<body>

    <div class="box">

        <h1>❤️ My Wishlist</h1>

        {% if items %}

        {% for item in items %}

        <div class="item">

            <img src="{{ item.product.image.url }}" alt="{{ item.product.name }}">

            <h3>{{ item.product.name }}</h3>

            <p>Rs {{ item.product.price }}</p>

            <p>{{ item.product.description }}</p>

            <!-- Remove Wishlist Button -->
            <a href="{% url 'remove_from_wishlist' item.id %}">
                <button class="remove-btn">❌ Remove Wishlist</button>
            </a>

        </div>

        {% endfor %}

        {% else %}

        <h2>No products in Wishlist ❤️</h2>

        {% endif %}

    </div>

</body>

</html>
